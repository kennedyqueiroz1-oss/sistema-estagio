          if (dbEnc[key] && dbEnc[key].length > 0) {
            hasAssignments = true;
            break;
          }
        }

        if (!hasAssignments && dbEmpresas.length > 0 && dbAlunos.length > 0) {
          console.log("Nenhum encaminhamento ativo encontrado no banco. Gerando mapeamento automático com dados reais...");
          dbEnc = {};
          let alunoIdx = 0;
          dbEmpresas.forEach((emp, empIdx) => {
            const numAlunos = 1 + (empIdx % 2); // 1 ou 2 alunos por empresa
            const assignedIds = [];
            for (let i = 0; i < numAlunos; i++) {
              if (alunoIdx < dbAlunos.length) {
                assignedIds.push(dbAlunos[alunoIdx].id);
                alunoIdx++;
              }
            }
            dbEnc[emp.id] = assignedIds;
          });
        }

        // Mapear para a estrutura da convocação
        empresas = dbEmpresas.map((emp, ei) => {
          const ids = dbEnc[emp.id] || [];
          const listAlunos = ids.map(aid => {
            const al = dbAlunos.find(a => a.id === aid);
            return al ? {
              id: al.id,
              nome: al.name,
              photoUrl: al.photo || null
            } : null;
          }).filter(Boolean);

          return {
            id: emp.id,
            nome: emp.name,
            tecnico: emp.tecnico || (ei % 2 === 0 ? 'Reinaldo' : 'Verônica'),
            alunos: listAlunos
          };
        }).filter(emp => emp.alunos.length > 0);
      }

      // Renderizar o setup inicial
      renderSetupComissao();
      updateChyronText();
    }

    async function salvarComissaoBanco(options = {}) {
      const silent = !!options.silent;
      const btn = document.getElementById('btn-save-comissao');
      const status = document.getElementById('comissao-save-status');
      if (btn && !silent) {
        btn.disabled = true;
        btn.textContent = 'SALVANDO...';
      }
      if (status) status.textContent = silent ? 'Salvando foto...' : '';

      let salvoServidor = false;
      if (authToken) {
        try {
          const r = await fetch('/api/dados', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${authToken}`
            },
            body: JSON.stringify({ chave: 'est_comissao', dados: comissaoTecnica })
          });
          const j = await r.json();
          salvoServidor = r.ok && j.ok;
        } catch (e) {
          console.warn("Falha ao salvar comissão no servidor. Salvando localmente...", e);
        }
      }

      try {
        localStorage.setItem('est_comissao', JSON.stringify(comissaoTecnica));
      } catch (e) {
        console.warn("Falha ao salvar comissão no localStorage:", e);
      }

      if (status) {
        status.textContent = salvoServidor ? 'Fotos salvas no banco.' : 'Fotos salvas localmente.';
        setTimeout(() => {
          if (status.textContent) status.textContent = '';
        }, 2500);
      }
      if (!silent) {
        alert(salvoServidor ? 'Fotos da comissão salvas no banco.' : 'Fotos da comissão salvas localmente.');
      }
      if (btn && !silent) {
        btn.disabled = false;
        btn.textContent = '💾 SALVAR FOTOS';
      }
    }

    async function salvarDadosBanco() {
      const btn = document.getElementById('btn-save-dados');
      if (btn) {
        btn.disabled = true;
        btn.textContent = '⏳ SALVANDO...';
      }

      try {
        // 1. Preparar novos dados de Alunos
        let newDbAlunos = [...(window.originalAlunos || [])];
        empresas.forEach(emp => {
          emp.alunos.forEach(al => {
            const existing = newDbAlunos.find(x => x.id === al.id);
            if (existing) {
              existing.name = al.nome;
              existing.photo = al.photoUrl;
            } else {
              newDbAlunos.push({
                id: al.id,
                name: al.nome,
                photo: al.photoUrl,
                curso: '',
                carga: {}
              });
            }
          });
        });

        // 2. Preparar novas Empresas
        let newDbEmpresas = [...(window.originalEmpresas || [])];
        empresas.forEach(emp => {
          const existing = newDbEmpresas.find(x => x.id === emp.id);
          if (existing) {
            existing.name = emp.nome;
            existing.tecnico = emp.tecnico;
          } else {
            newDbEmpresas.push({
              id: emp.id,
              name: emp.nome,
              tecnico: emp.tecnico,
              entrada: '08:00',
              saida: '12:00',
              vagas: 3
            });
          }
        });
        newDbEmpresas = newDbEmpresas.filter(e => empresas.some(x => x.id === e.id));

        // 3. Preparar novos Encaminhamentos
        let newDbEnc = {};
        empresas.forEach(emp => {
          newDbEnc[emp.id] = emp.alunos.map(a => a.id);
        });

        // 4. Preparar Comissão Técnica
        let newComissao = comissaoTecnica;

        // 5. Salvar (Servidor ou LocalStorage)
        let salvoServidor = false;
        if (authToken) {
          try {
            const headers = {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${authToken}`
            };

            const [resEmp, resAlunos, resEnc, resComissao] = await Promise.all([
              fetch('/api/dados', {
                method: 'POST',
                headers,
                body: JSON.stringify({ chave: 'est_emp', dados: newDbEmpresas })
              }),
              fetch('/api/dados', {
                method: 'POST',
                headers,
                body: JSON.stringify({ chave: 'est_alunos', dados: newDbAlunos })
              }),
              fetch('/api/dados', {
                method: 'POST',
                headers,
                body: JSON.stringify({ chave: 'est_enc', dados: newDbEnc })
              }),
              fetch('/api/dados', {
                method: 'POST',
                headers,
                body: JSON.stringify({ chave: 'est_comissao', dados: newComissao })
              })
            ]);

            if (resEmp.ok && resAlunos.ok && resEnc.ok && resComissao.ok) {
              const jEmp = await resEmp.json();
              const jAl = await resAlunos.json();
              const jEnc = await resEnc.json();
              const jCom = await resComissao.json();
              if (jEmp.ok && jAl.ok && jEnc.ok && jCom.ok) {
                salvoServidor = true;
              }
            }
          } catch (e) {
            console.warn("Falha ao salvar no servidor. Salvando no localStorage...", e);
          }
        }

        // Salvar localmente como redundância / offline
        let salvoLocal = true;
        try {
          localStorage.setItem('est_emp', JSON.stringify(newDbEmpresas));
        } catch (e) {
          console.warn("Falha ao salvar est_emp no localStorage:", e);
          salvoLocal = false;
        }
        try {
          localStorage.setItem('est_alunos', JSON.stringify(newDbAlunos));
        } catch (e) {
          console.warn("Falha ao salvar est_alunos no localStorage:", e);
          salvoLocal = false;
        }
        try {
          localStorage.setItem('est_enc', JSON.stringify(newDbEnc));
        } catch (e) {
          console.warn("Falha ao salvar est_enc no localStorage:", e);
          salvoLocal = false;
        }
        try {
          localStorage.setItem('est_comissao', JSON.stringify(newComissao));
        } catch (e) {
          console.warn("Falha ao salvar est_comissao no localStorage:", e);
          salvoLocal = false;
        }

        // Atualizar variáveis originais em memória
        window.originalEmpresas = newDbEmpresas;
        window.originalAlunos = newDbAlunos;
        window.originalEnc = newDbEnc;

        if (salvoServidor) {
          if (salvoLocal) {
            alert('💾 Alterações salvas com sucesso no banco de dados (Supabase) e localmente!');
          } else {
            alert('💾 Alterações salvas com sucesso no banco de dados (Supabase)!\n(Nota: O limite de armazenamento do navegador foi excedido localmente devido ao tamanho das imagens, mas os dados foram salvos no servidor online com sucesso.)');
          }
        } else {
          if (salvoLocal) {
            alert('💾 Alterações salvas com sucesso localmente (modo offline)!');
          } else {
            alert('❌ Não foi possível salvar os dados no servidor e o limite de armazenamento local foi excedido. Tente reduzir o tamanho das fotos.');
          }
        }

      } catch (err) {
        console.error(err);
        alert('❌ Ocorreu um erro ao salvar as alterações: ' + err.message);
      } finally {
        if (btn) {
          btn.disabled = false;
          btn.textContent = '💾 SALVAR ALTERAÇÕES NO BANCO';
        }
      }
    }

    function detectarPacoteCustomizado() {
      const formatos = ['pacote.png', 'pacote.jpg', 'pacote.jpeg', 'pacote.webp'];
      let detectado = false;

      formatos.forEach(src => {
        if (detectado) return;
        const img = new Image();
        img.onload = () => {
          if (detectado) return;
          detectado = true;
          const container = document.getElementById('pack-container');
          if (container) {
            container.classList.add('has-custom-pack');
            container.style.setProperty('--pack-image-url', `url('${src}')`);
          }
        };
        img.src = src;
      });
    }

    // Inicializar carregamento de dados
    carregarDados();
    detectarPacoteCustomizado();
    tocarMusicaEspera();
  </script>
